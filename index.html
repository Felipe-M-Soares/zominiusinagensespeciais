<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zomini Usinagens Especiais</title>
    <meta name="description" content="Zomini ERP — estoque, produção, qualidade (ANVISA), comercial e financeiro." />
    <meta name="author" content="Zomini Usinagens Especiais" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- O manifest do PWA é gerado e injetado pelo vite-plugin-pwa (manifest.webmanifest). -->

    <!-- Conexão antecipada com o Supabase (substituído no build por VITE_SUPABASE_URL) -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <meta name="theme-color" content="#f5f6f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zomini" />
    <!-- Content-Security-Policy e demais headers de segurança: vercel.json -->

    <!-- Aplica o tema antes do React montar (evita "flash" de tema errado).
         Mesmo padrão de src/lib/theme.ts: sem valor salvo = claro. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && dark) m.setAttribute("content", "#0f1115");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Este sistema precisa do JavaScript habilitado.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
