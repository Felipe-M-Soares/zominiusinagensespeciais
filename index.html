<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Concept" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- PERF: preconnect reduz latência ao carregar fontes do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- NOTA: Content-Security-Policy autoritativa está em vercel.json (HTTP header).
         Meta CSP foi removida — conflitava com vercel.json e tinha font-src incorreto.
         frame-ancestors só funciona via HTTP header, não via meta tag. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- Aplica tema antes do React montar para evitar flash de tema errado -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>Concept Usinagens Especiais</title>
    <meta name="description" content="Base de dados de dispositivos dentários - Conformidade ANVISA" />
    <meta name="author" content="Concept Usinagens Especiais" />
    <meta property="og:title" content="Concept Usinagens Especiais" />
    <meta property="og:description" content="Base de dados de dispositivos médicos - Conformidade ANVISA" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
