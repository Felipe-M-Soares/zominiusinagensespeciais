# Nome local do projeto. O projeto remoto é definido por `supabase link`.
project_id = "zomini-erp"

# verify_jwt = false: estas funções validam o JWT manualmente (auth.getUser)
# e checam o role de admin no banco antes de qualquer ação. Deixar o gateway
# sem verificação evita falhas com as novas chaves assimétricas do Supabase.
[functions.admin-reset-password]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = false
